name: Release Charts

on:
  push:
    branches:
      - main
      - releases/**

jobs:
  release:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: configure_git
        name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - id: setup_helm
        name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

      - id: configure_helm_repositories
        name: Configure Helm repositories
        run: |
          helm repo add ontotext https://maven.ontotext.com/repository/helm-public/
          helm repo add poolparty https://poolparty-semantic-suite.github.io/charts
          helm repo add graphrag https://poolparty-semantic-suite.github.io/graphrag-charts
          helm repo add graph-automation https://poolparty-semantic-suite.github.io/graph-automation-charts

      - id: run_chart_releaser
        name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: "charts/"
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
