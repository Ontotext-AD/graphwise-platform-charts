#
# Official Helm chart for deploying Graphiwse Platform.
#
apiVersion: v2
name: graphwise-platform
description: |
  Umbrella chart for deploying Graphwise Platform:
  The Enterprise AI Platform that turns fragmented data into hallucination-free business outcomes.
type: application
version: 0.1.0
kubeVersion: ^1.34.0-0
home: https://graphwise.ai/
icon: https://graphwise.ai/wp-content/uploads/2024/10/cropped-graphwise_favicon-192x192.png
maintainers:
  - name: Ontotext-AD
    email: dnd@graphwise.ai
    url: https://graphwise.ai
sources:
  - https://github.com/Ontotext-AD/graphwise-platform-charts
keywords:
  - graphwise
  - graphdb
  - graph modeling
  - knowledge graph
  - enterprise data
dependencies:
  - name: elasticsearch-snapshots
    version: 1.0.0
    repository: file://../elasticsearch-snapshots
    alias: elasticsearch_snapshots
    condition: elasticsearch_snapshots.enabled

  # https://github.com/Ontotext-AD/graphdb-helm
  # GraphDB 11.4.0
  - name: graphdb
    version: 12.4.0
    repository: https://maven.ontotext.com/repository/helm-public/
    condition: graphdb.enabled

  # Graph Modeling fka PoolParty
  # https://github.com/poolparty-semantic-suite/charts
  # Graph Modeling 10.2.2
  - name: poolparty
    version: 0.3.3
    repository: https://poolparty-semantic-suite.github.io/charts
    alias: graph-modeling
    condition: graph-modeling.enabled

  # https://github.com/poolparty-semantic-suite/charts
  # ADF 1.8.2
  - name: adf
    version: 0.1.3
    repository: https://poolparty-semantic-suite.github.io/charts
    condition: adf.enabled

  # https://github.com/poolparty-semantic-suite/charts
  # GraphViews 1.0.0
  - name: graphviews
    version: 0.1.1
    repository: https://poolparty-semantic-suite.github.io/charts
    condition: graphviews.enabled

  # https://github.com/poolparty-semantic-suite/charts
  # Semantic Workbench 2.4.2
  - name: semantic-workbench
    version: 0.1.3
    repository: https://poolparty-semantic-suite.github.io/charts
    condition: semantic-workbench.enabled
