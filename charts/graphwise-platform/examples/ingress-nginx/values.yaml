keycloak:
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: HTTP
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"

# GraphDB needs the request to be stripped of the /graphdb prefix
graphdb:
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/x-forwarded-prefix: /graphdb
    pathType: ImplementationSpecific
    path: /graphdb(/|$)(.*)

graph-modeling:
  ingress:
    enabled: true
    className: nginx

adf:
  ingress:
    enabled: true
    className: nginx

graphviews:
  ingress:
    enabled: true
    className: nginx

semantic-workbench:
  ingress:
    enabled: true
    className: nginx

graphrag:
  chatbot:
    ingress:
      enabled: true
      className: nginx

  workflows:
    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$2
      path: /graphrag/workflows(/|$)(.*)
      pathType: ImplementationSpecific
