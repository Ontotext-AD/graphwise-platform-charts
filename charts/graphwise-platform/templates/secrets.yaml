---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $graphdbClusterTokenSecretName }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "graphwise-platform.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.secrets.preserve }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.annotations }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
type: Opaque
data:
  GRAPHDB_CLUSTER_TOKEN: {{ $graphdbClusterTokenB64 | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $graphModelingAdminCredentialsSecretName }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "graphwise-platform.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.secrets.preserve }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.annotations }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
type: Opaque
data:
  username: {{ "superadmin" | b64enc | quote }}
  password: {{ $graphModelingSuperAdminPasswordB64 | quote }}

{{- if .Values.graphrag.enabled }}

{{- $graphragConversationDatabaseCredentialsSecretName := .Values.secrets.graphrag.conversation.databaseCredentialsSecretName -}}
{{- $graphragConversationDatabaseCredentialsSecret := (lookup "v1" "Secret" $keycloakNamespace $keycloakSecretName | default dict) -}}
{{- $graphragConversationDatabaseCredentialsSecretData := (get $keycloakSecret "data" | default dict) -}}

{{- $graphragConversationKeycloakSecretsSecretName := .Values.secrets.graphrag.conversation.keycloakSecretsSecretName -}}
{{- $graphragConversationKeycloakSecretsSecret := (lookup "v1" "Secret" $keycloakNamespace $keycloakSecretName | default dict) -}}
{{- $graphragConversationKeycloakSecretsSecretData := (get $keycloakSecret "data" | default dict) -}}

{{- $graphragWorkflowsEncryptionSecretName := .Values.secrets.graphrag.workflows.encryptionSecretName -}}
{{- $graphragWorkflowsEncryptionSecret := (lookup "v1" "Secret" $keycloakNamespace $keycloakSecretName | default dict) -}}
{{- $graphragWorkflowsEncryptionSecretData := (get $keycloakSecret "data" | default dict) -}}

{{- $graphragConversationDatabasePasswordB64 := coalesce
      (get $graphragConversationDatabaseCredentialsSecretData "password")
      (randAlphaNum 24 | b64enc)
-}}

{{- $graphragConversationKeycloakClientSecretB64 := coalesce
      (get $graphragConversationKeycloakSecretsSecretData "client-secret")
      (randAlphaNum 24 | b64enc)
-}}

{{- $graphragWorkflowsEncryptionSecretB64 := coalesce
      (get $graphragWorkflowsEncryptionSecretData "N8N_ENCRYPTION_KEY")
      (randAlphaNum 24 | b64enc)
-}}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $graphragConversationDatabaseCredentialsSecretName }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "graphwise-platform.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.secrets.preserve }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.annotations }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
type: Opaque
data:
  username: {{ "graphrag" | b64enc | quote }}
  password: {{ $graphragConversationDatabasePasswordB64 | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $graphragConversationKeycloakSecretsSecretName }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "graphwise-platform.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.secrets.preserve }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.annotations }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
type: Opaque
data:
  client-secret: {{ $graphragConversationKeycloakClientSecretB64 | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $graphragConversationKeycloakSecretsSecretName }}
  namespace: {{ $platformNamespace }}
  labels:
    {{- include "graphwise-platform.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.secrets.preserve }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.annotations }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
type: Opaque
data:
  N8N_ENCRYPTION_KEY: {{ $graphragWorkflowsEncryptionSecretB64 | quote }}
{{- end }}
{{- end }}
