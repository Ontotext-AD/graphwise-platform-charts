  replicas: {{ .Values.automation.morphkgc.kafka.topics.results.replicas }}
  {{- with .Values.automation.morphkgc.kafka.topics.results.config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
