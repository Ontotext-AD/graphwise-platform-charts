{{- if and .Values.automation.enabled .Values.automation.kafka.enabled }}
{{- /*
Topics for the Document Ingestion workflows
*/}}
{{- if .Values.automation.ingestion.kafka.enabled }}
{{- range $key, $topic := .Values.automation.ingestion.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ tpl $topic.name $ | trunc 63 | trimSuffix "-" }}
  labels:
    strimzi.io/cluster: {{ $.Values.automation.kafka.clusterName }}
    {{- include "graphwise-platform.labels" $ | nindent 4 }}
  {{- with $.Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  topicName: {{ tpl $topic.name $ }}
  partitions: {{ $topic.partitions }}
  replicas: {{ $topic.replicas }}
  {{- with $topic.config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
---
{{- /*
Topics for the RML processing with MorphKGC
*/}}
{{- if .Values.automation.morphkgc.enabled }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ printf "%s-morphkgc-jobs" .Values.automation.kafka.clusterName | trunc 63 | trimSuffix "-" }}
  labels:
    strimzi.io/cluster: {{ .Values.automation.kafka.clusterName }}
    {{- include "graphwise-platform.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
