    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  topicName: {{ .Values.automation.morphkgc.configuration.properties.KAFKA_JOBS_TOPIC }}
  partitions: {{ .Values.automation.morphkgc.kafka.topics.jobs.partitions }}
  replicas: {{ .Values.automation.morphkgc.kafka.topics.jobs.replicas }}
  {{- with .Values.automation.morphkgc.kafka.topics.jobs.config }}
  config:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
