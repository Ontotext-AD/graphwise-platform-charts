# Semantic Workbench configuration overrides
#
# Semantic Workbench is an addon for the Graph Modeling service.
#
# You can check the following reference for the full set of configuration options:
# Ref: https://github.com/poolparty-semantic-suite/charts
semantic-workbench:
  # Toggles the deployment of the Semantic Workbench service.
  enabled: false

  # Overrides the default name of the Semantic Workbench service for easier configurations in the rest of the services.
  fullnameOverride: semantic-workbench

  # The Semantic Workbench service requires a commerical license for operation.
  # This usually is the same license as for the Graph Modeling service.
  license:
    # Reference to a secret containing 'poolparty.key' file that will be mounted in the Semantic Workbench pod.
    existingSecret: graph-modeling-license
    licenseFilename: poolparty.key

  # Semantic Workbench configuration settings.
  configuration:
    # The external URL at which Semantic Workbench should be accessible.
    externalUrl: '{{ include "graphwise-platform.url" . }}/SemanticWorkbench'

    # Semantic Workbench configuration properties.
    properties:
      KEYCLOAK_URL: http://keycloak-service.keycloak:8080/auth/
      POOLPARTY_URL: http://graph-modeling:8080
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: '{{ include "graphwise-platform.url" . }}/auth/realms/poolparty/protocol/openid-connect/auth'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: '{{ include "graphwise-platform.url" . }}/auth/realms/poolparty'

  # Ingress configuration.
  # Refer to the official chart for further details.
  ingress:
    enabled: false

  # Additional environment variables to be set in the Semantic Workbench container.
  # Note the reference to the Kubernetes Secret: If you have created it with a different name, you need
  # to update it here.
  extraEnv:
    - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_PPT_CLIENTSECRET
      valueFrom:
        secretKeyRef:
          name: graph-modeling-secret-properties
          key: POOLPARTY_KEYCLOAK_LOGIN_CLIENTSECRET

  # Persistence configurations for Semantic Workbench.
  persistence:
    enabled: true
    volumeClaimTemplate:
      spec:
        # You can pass an explicit storage class name here or rely on the default storage class in your Kubernetes cluster.
        # storageClassName:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

  # Selector labels to match when selecting nodes.
  nodeSelector: {}

  # Configurations for spreading Pods across different failure domains.
  topologySpreadConstraints: []

  # Resource configurations for the Semantic Workbench pod.
  resources:
    requests:
      memory: 2Gi
    limits:
      memory: 2Gi
